packages:
  - apps/*
  - packages/*
  - workers/*
allowBuilds:
  esbuild: true
  sharp: true
  cpu-features: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@opentelemetry/configuration@0.301.0'
  - '@opentelemetry/context-async-hooks@3.1.0'
  - '@opentelemetry/core@3.1.0'
  - '@opentelemetry/exporter-logs-otlp-grpc@0.301.0'
  - '@opentelemetry/exporter-logs-otlp-http@0.301.0'
  - '@opentelemetry/exporter-logs-otlp-proto@0.301.0'
  - '@opentelemetry/exporter-metrics-otlp-grpc@0.301.0'
  - '@opentelemetry/exporter-metrics-otlp-http@0.301.0'
  - '@opentelemetry/exporter-metrics-otlp-proto@0.301.0'
  - '@opentelemetry/exporter-prometheus@0.301.0'
  - '@opentelemetry/exporter-trace-otlp-grpc@0.301.0'
  - '@opentelemetry/exporter-trace-otlp-http@0.301.0'
  - '@opentelemetry/exporter-trace-otlp-proto@0.301.0'
  - '@opentelemetry/exporter-zipkin@3.1.0'
  - '@opentelemetry/instrumentation@0.301.0'
  - '@opentelemetry/otlp-exporter-base@0.301.0'
  - '@opentelemetry/otlp-grpc-exporter-base@0.301.0'
  - '@opentelemetry/otlp-transformer@0.301.0'
  - '@opentelemetry/propagator-b3@3.1.0'
  - '@opentelemetry/resources@3.1.0'
  - '@opentelemetry/sdk-logs@3.1.0'
  - '@opentelemetry/sdk-metrics@3.1.0'
  - '@opentelemetry/sdk-node@0.301.0'
  - '@opentelemetry/sdk-trace@3.1.0'
overrides:
  '@opentelemetry/propagator-jaeger': 2.12.0
  postcss: 8.5.32
  protobufjs: 8.8.1
  sharp: 0.35.5
